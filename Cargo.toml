[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/jpetrucciani/kodo"
rust-version = "1.100"

[workspace.dependencies]
kodo-core = { path = "crates/kodo-core" }
kodo-sources = { path = "crates/kodo-sources" }
open = "5.4.5"
rfd = "0.18.0"
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
iced = { version = "=0.14.0", features = ["tokio", "markdown", "qr_code", "advanced", "image-without-codecs"] }
# Decoders for README images only; the default set pulls in heavy AVIF/TIFF codecs.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
notify-rust = "4.19.0"
embed-resource = "3.0.12"
indicatif = "0.18.6"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
toml = "1.2.1"
wiremock = "0.6.5"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
