name: autotag
# When a push to main changes the workspace version, tag it v<version> and release it. A version
# with a pre-release part (0.2.0-rc.1) becomes a prerelease. Tags pushed with GITHUB_TOKEN don't
# start other workflows, so this calls release.yml itself.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]

concurrency:
  group: autotag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        name: Tag the version unless it already is
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
